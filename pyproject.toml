[project]
name = "falcon-image-marker"
version = "1.0.0"
description = "GUI tool to display an image and mark locations with a vertical line."
readme = "README.md"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.6.0",
    "Pillow>=10.0.0",
    "svgpathtools>=1.7.0",
]

[project.scripts]
falcon-marker = "app.main:main"

[project.urls]
"Homepage" = "https://example.com"
"Repository" = "https://example.com/repo"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
